# Test profile: in-memory H2 database in MySQL-compatibility mode. No external services needed.
spring.datasource.url=jdbc:h2:mem:cityshield;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
cityshield.seed.enabled=true
