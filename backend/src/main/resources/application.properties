spring.application.name=cityshield
server.port=8080

# --- Database: credentials come from environment variables, never from source code ---
spring.datasource.url=${CITYSHIELD_DB_URL:jdbc:mysql://localhost:3306/cityshield?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${CITYSHIELD_DB_USER:cityshield_app}
spring.datasource.password=${CITYSHIELD_DB_PASSWORD:}

# Schema is created by db/schema.sql using CREATE TABLE IF NOT EXISTS (existing data is never dropped).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# Seed data is loaded from classpath:seed/*.csv only when city_zones is empty.
cityshield.seed.enabled=true
cityshield.cors.allowed-origins=${CITYSHIELD_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
